<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Lab App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cyber-lab-app">
        <div class="card-header"></div>

        <span id="currentTokenValue" style="display: none;"></span>

        <div class="form-group">
            <input type="text" id="modelSearch" class="search-input" value="meta-llama/Llama-3.1-8B-Instruct" placeholder="Search models..." autocomplete="off">
            <div id="modelDropdown" class="dropdown-list"></div>
            <input type="hidden" id="selectedModelValue" value="">
        </div>

        <div class="form-group">
            <div class="editor-wrapper">
                <div class="editor-header"><span>USER_INPUT</span></div>
                <textarea id="promptText" class="code-input" placeholder="Enter query..." spellcheck="false"></textarea>
            </div>
        </div>

        <button id="sendBtn" class="execute-btn" onclick="sendRouterRequest()" disabled>Execute</button>

        <div class="response-container">
            <label>Response & Analysis:</label>
            <div class="editor-wrapper">
                <div class="editor-header">
                    <span>AI_RESPONSE</span>
                    <div class="header-actions">
                        <button class="action-btn" onclick="speakResponse(event, 'explanationOutput')">Speak</button>
                        <button class="action-btn" onclick="copyText(event, 'explanationOutput')">Copy Text</button>
                    </div>
                </div>
                <div id="explanationOutput" class="output-box">Waiting for input...</div>
                
                <div id="embeddedCodeContainer" class="embedded-code-box">
                    <div class="editor-header">
                        <span>EXTRACTED_CODE</span>
                        <button class="action-btn" onclick="copyText(event, 'embeddedCodeOutput')">Copy Code</button>
                    </div>
                    <div id="embeddedCodeOutput" class="code-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="security_key.js"></script>
    <script src="script.js"></script>
</body>
</html>
